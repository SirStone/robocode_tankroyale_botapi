name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nim-version: ['stable']
    runs-on: ${{ matrix.os }}
    env:
      TANK_ROYALE_JAR: ${{ github.workspace }}/robocode-tankroyale-runner.jar
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Cache nimble
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-${{ hashFiles('*.nimble') }}
          restore-keys: ${{ runner.os }}-nimble-

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Download Tank Royale runner JAR
        shell: bash
        run: |
          LATEST_TAG=$(gh api repos/robocode-dev/tank-royale/releases/latest --jq .tag_name)
          VERSION="${LATEST_TAG#v}"
          curl -fSL -o robocode-tankroyale-runner.jar "https://github.com/robocode-dev/tank-royale/releases/download/${LATEST_TAG}/robocode-tankroyale-runner-${VERSION}.jar"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run tests
        run: nimble test -y

      - name: Build sample bot (smoke test)
        run: nim c --threads:on --hints:off -o:MyFirstBot sample_bots/MyFirstBot/MyFirstBot.nim
