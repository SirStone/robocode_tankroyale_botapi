name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nim-version: ['stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Cache nimble
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-${{ hashFiles('*.nimble') }}
          restore-keys: ${{ runner.os }}-nimble-

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Run tests
        run: nimble test -y

      - name: Build sample bot (smoke test)
        run: nim c --threads:on --hints:off -o:MyFirstBot sample_bots/MyFirstBot/MyFirstBot.nim
