name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TANK_ROYALE_JAR: ${{ github.workspace }}/robocode-tankroyale-runner.jar
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag is valid and matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # Nimble only installs git tags that parse as a version.
          # Accept vX[.Y[.Z]][-prerelease][+build], like v1.0.6 or v1.0.4-rc1.
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid Nimble release tag (expected vX.Y.Z, optionally with a -prerelease suffix)."
            exit 1
          fi
          # The tag's version must match the version declared in the .nimble file.
          PKG_VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' robocode_tankroyale_botapi.nimble)"
          TAG_CORE="${TAG#v}";  TAG_CORE="${TAG_CORE%%[-+]*}"
          NIM_CORE="${PKG_VERSION%%[-+]*}"
          if [[ "$TAG_CORE" != "$NIM_CORE" ]]; then
            echo "::error::Tag version '$TAG_CORE' does not match the version '$PKG_VERSION' in robocode_tankroyale_botapi.nimble. Bump the version before releasing."
            exit 1
          fi
          echo "OK: tag '$TAG' is a valid release tag and matches package version '$PKG_VERSION'."

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable

      - name: Cache nimble
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-${{ hashFiles('*.nimble') }}
          restore-keys: ${{ runner.os }}-nimble-

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Compile-check API module
        run: nim c --threads:on --mm:orc --hints:off -o:/tmp/api_check src/robocode_tankroyale_botapi.nim

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Download Tank Royale runner JAR
        shell: bash
        run: |
          LATEST_TAG=$(gh api repos/robocode-dev/tank-royale/releases/latest --jq .tag_name)
          VERSION="${LATEST_TAG#v}"
          curl -fSL -o robocode-tankroyale-runner.jar "https://github.com/robocode-dev/tank-royale/releases/download/${LATEST_TAG}/robocode-tankroyale-runner-${VERSION}.jar"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run tests
        run: nimble test -y

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable

      - name: Cache nimble
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-${{ hashFiles('*.nimble') }}
          restore-keys: ${{ runner.os }}-nimble-

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Compile bots (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for src in sample_bots/*/*.nim; do
            dir=$(dirname "$src")
            name=$(basename "$dir")
            mkdir -p "staging/$name"
            nim c --threads:on --hints:off -d:danger -o:"staging/$name/$name" "$src"
            cp "$dir"/*.sh "$dir"/*.cmd "$dir"/*.json "staging/$name/"
            chmod +x "staging/$name/$name" "staging/$name"/*.sh
          done

      - name: Compile bots (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem sample_bots -Directory | ForEach-Object {
            $name = $_.Name
            $src = "sample_bots/$name/$name.nim"
            if (Test-Path $src) {
              New-Item -ItemType Directory -Force -Path "staging/$name" | Out-Null
              nim c --threads:on --hints:off -d:danger "-o:staging/$name/$name.exe" $src
              Copy-Item "sample_bots/$name/*.sh"   "staging/$name/" -ErrorAction SilentlyContinue
              Copy-Item "sample_bots/$name/*.cmd"  "staging/$name/"
              Copy-Item "sample_bots/$name/*.json" "staging/$name/"
            }
          }

      - name: Copy MyFirstTeam (config-only)
        shell: bash
        run: |
          mkdir -p staging/MyFirstTeam
          cp sample_bots/MyFirstTeam/*.json staging/MyFirstTeam/

      - name: Zip staging (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd staging && zip -r "../sample-bots-nim-${{ matrix.platform }}-${VERSION}.zip" .

      - name: Zip staging (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Compress-Archive -Path staging\* -DestinationPath "sample-bots-nim-${{ matrix.platform }}-${version}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-bots-nim-${{ matrix.platform }}
          path: sample-bots-nim-${{ matrix.platform }}-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Sample Bots — Nim

            Native binaries for Linux, macOS, and Windows compiled from the Nim source.

            **macOS users:** If the binary is quarantined by Gatekeeper, run:
            ```
            xattr -d com.apple.quarantine <binary>
            ```
            or right-click the binary → Open.
          files: sample-bots-nim-*.zip
